<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>启动失败 - ExamLex</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: white;
      padding: 20px;
    }

    .error-container {
      text-align: center;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    .error-icon {
      font-size: 80px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      opacity: 0.9;
      margin-bottom: 30px;
    }

    .solutions {
      text-align: left;
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .solutions h3 {
      font-size: 18px;
      margin-bottom: 15px;
    }

    .solutions ol {
      padding-left: 20px;
    }

    .solutions li {
      margin-bottom: 10px;
      font-size: 14px;
      line-height: 1.6;
    }

    .code {
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 8px;
      border-radius: 4px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
    }

    .btn {
      display: inline-block;
      padding: 12px 30px;
      background: white;
      color: #f5576c;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s;
    }

    .btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="error-icon">❌</div>
    <h1>启动失败</h1>
    <p>ExamLex 后端服务启动失败，请检查以下问题：</p>

    <div class="solutions">
      <h3>🔧 解决方案：</h3>
      <ol>
        <li>确保已安装 Python 3.8+：<span class="code">python --version</span></li>
        <li>安装依赖：<span class="code">pip install -r requirements.txt</span></li>
        <li>检查 .env 文件是否配置了 API Key</li>
        <li>确保端口 8765 未被占用</li>
        <li>查看终端日志获取详细错误信息</li>
      </ol>
    </div>

    <a href="#" class="btn" onclick="location.reload()">重新启动</a>
  </div>
</body>
</html>
