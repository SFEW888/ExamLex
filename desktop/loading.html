<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamLex 启动中...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: white;
    }

    .loading-container {
      text-align: center;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      font-size: 80px;
      margin-bottom: 20px;
      animation: bounce 1s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .app-name {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .tagline {
      font-size: 16px;
      opacity: 0.9;
      margin-bottom: 40px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status {
      font-size: 14px;
      opacity: 0.8;
    }

    .progress {
      width: 300px;
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      margin: 30px auto 0;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: white;
      border-radius: 2px;
      animation: progress 2s ease infinite;
    }

    @keyframes progress {
      0% { width: 0; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="loading-container">
    <div class="logo">📚</div>
    <h1 class="app-name">ExamLex</h1>
    <p class="tagline">AI 驱动的英语备考系统</p>
    <div class="spinner"></div>
    <p class="status">正在启动后端服务...</p>
    <div class="progress">
      <div class="progress-bar"></div>
    </div>
  </div>
</body>
</html>
